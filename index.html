<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Личный бюджет</title>
<meta name="description" content="Личный планер бюджета: поступления, конверты, платежи и история. Работает без интернета.">
<meta name="theme-color" content="#F5F2EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13160F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Бюджет">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
/* Макет: одна колонка до 520px, большие числа, нижняя навигация и «листы» снизу под большой палец.
   Палитра: молочный фон, оливково-зелёный акцент, приглушённые янтарный и кирпичный для состояний. */
:root{
  --bg:#F5F2EA;--surface:#FFFDF8;--surface2:#EEEADD;--ink:#262A21;--muted:#6B7062;--line:#E3DECF;
  --accent:#5B7545;--accent-ink:#FFFFFF;--accent-soft:#E2E9D5;--accent-deep:#3E5430;
  --warn:#9A6A12;--warn-soft:#F4E7C9;--bad:#A24B38;--bad-soft:#F3DED6;--good:#4C7A3A;
  --scrim:rgba(24,26,18,.45);
  --f-ui:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-num:'Geologica','Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13160F;--surface:#1B1F16;--surface2:#252A1D;--ink:#ECEADF;--muted:#A1A693;--line:#2D3226;
  --accent:#A2BF88;--accent-ink:#17200F;--accent-soft:#2A3420;--accent-deep:#C4DAAB;
  --warn:#E2B55E;--warn-soft:#3A301A;--bad:#E48D78;--bad-soft:#3E2620;--good:#9CC882;--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13160F;--surface:#1B1F16;--surface2:#252A1D;--ink:#ECEADF;--muted:#A1A693;--line:#2D3226;
  --accent:#A2BF88;--accent-ink:#17200F;--accent-soft:#2A3420;--accent-deep:#C4DAAB;
  --warn:#E2B55E;--warn-soft:#3A301A;--bad:#E48D78;--bad-soft:#3E2620;--good:#9CC882;--scrim:rgba(0,0,0,.6);color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.4;padding-inline:16px;padding-block:0;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding-block:14px 150px;min-width:0}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--muted)}
.sm{font-size:14px}
.xs{font-size:13px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.sp{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos{color:var(--good)}.neg{color:var(--bad)}.warnc{color:var(--warn)}

/* шапка */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.mbar{display:flex;align-items:center;gap:2px}
.mbar .m{font-family:var(--f-num);font-weight:600;font-size:19px;min-width:150px;text-align:center}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.ib:active{background:var(--surface2)}
.ib svg,.nav svg,.fab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pagetitle{font-family:var(--f-num);font-size:26px;font-weight:600;letter-spacing:-.02em}

/* карточки */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.hero{background:var(--accent-deep);color:#F4F7EC;border-radius:28px;padding:22px 20px 20px;border:0}
:root[data-theme="dark"] .hero{color:#17200F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero{color:#17200F}}
.hero .eyebrow{font-size:14px;opacity:.85}
.hero .big{font-family:var(--f-num);font-weight:600;font-size:46px;letter-spacing:-.03em;line-height:1.1;margin:4px 0 14px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.split{height:8px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.split i{display:block;height:100%;background:rgba(255,255,255,.9);border-radius:99px}
:root[data-theme="dark"] .split{background:rgba(0,0,0,.2)}:root[data-theme="dark"] .split i{background:rgba(0,0,0,.65)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .split{background:rgba(0,0,0,.2)}:root:not([data-theme="light"]) .split i{background:rgba(0,0,0,.65)}}
.legend{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-top:10px;flex-wrap:wrap}
.safe{background:var(--accent-soft);border-radius:var(--r);padding:16px 18px;border:0}
.safe .lab{font-size:14px;color:var(--accent-deep)}
.safe .v{font-family:var(--f-num);font-size:32px;font-weight:600;letter-spacing:-.02em;color:var(--accent-deep);font-variant-numeric:tabular-nums}
.safe p{font-size:14px;color:var(--muted);margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;min-width:0}
.stat .l{font-size:13.5px;color:var(--muted)}
.stat .v{font-family:var(--f-num);font-size:22px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;overflow-wrap:anywhere}
.sect{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 10px;gap:10px}
.sect h2{font-size:18px}
.link{color:var(--accent-deep);font-weight:500;font-size:15px;min-height:44px;display:inline-flex;align-items:center}
.banner{border-radius:16px;padding:12px 14px;font-size:14.5px;display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--ink)}
.banner.bad{background:var(--bad-soft)}.banner.good{background:var(--accent-soft)}
.banner b{font-weight:600}

/* кнопки */
.btn{min-height:50px;border-radius:16px;padding:0 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface2);color:var(--ink);text-align:center;line-height:1.2}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--accent-soft);color:var(--accent-deep)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{min-height:40px;border-radius:12px;padding:0 14px;font-size:15px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn:active:not(:disabled){transform:scale(.985)}
.quick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.quick .btn{flex-direction:column;gap:2px;padding:8px 6px;min-height:62px;font-size:14px}
.quick .btn.primary{grid-column:1/-1;flex-direction:row;min-height:56px;font-size:17px}

/* списки */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:60px;width:100%;text-align:left}
.li + .li{border-top:1px solid var(--line)}
button.li:active{background:var(--surface2)}
.li .t{font-weight:500;overflow-wrap:anywhere}
.li .s{font-size:14px;color:var(--muted)}
.amt{font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
.pill{display:inline-block;font-size:12.5px;font-weight:500;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent-deep)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.chk{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* конверты */
.gh{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 8px;gap:10px}
.gh h3{font-size:15px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.cat{padding:14px 16px;display:block;width:100%;text-align:left}
.cat + .cat{border-top:1px solid var(--line)}
button.cat:active{background:var(--surface2)}
.cat .nm{font-weight:500}
.prog{height:7px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:9px}
.prog i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.prog.warn i{background:var(--warn)}.prog.bad i{background:var(--bad)}
.mini{display:flex;gap:14px;font-size:13.5px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.mini b{font-weight:500;color:var(--ink)}
.cols4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 14px;margin-top:10px}
.cols4 div{min-width:0}.cols4 .l{font-size:13px;color:var(--muted)}.cols4 .v{font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums;font-size:16px}

/* навигация */
.nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.nav > div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr 1fr;gap:2px;align-items:center}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;min-height:56px;border-radius:14px;color:var(--muted);font-size:12.5px;font-weight:500}
.nav button.on{color:var(--accent-deep);background:var(--accent-soft)}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;z-index:19;box-shadow:0 6px 18px rgba(30,40,20,.28)}
.fab svg{width:28px;height:28px;stroke-width:2.2}

/* листы */
.ov{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease-out}
.sheet{width:100%;max-width:520px;max-height:92%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-family:var(--f-num);font-size:22px;letter-spacing:-.02em;margin-bottom:4px}
.sheet .foot{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));background:var(--surface);padding:12px 0 2px;margin-top:14px;display:flex;gap:10px;flex-direction:column}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
@keyframes fade{from{opacity:0}}
.page{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;padding:0 16px calc(40px + env(safe-area-inset-bottom,0px));padding-top:env(safe-area-inset-top,0px)}
.page > .in{max-width:520px;margin:0 auto;padding-block:12px 40px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;z-index:90;font-size:15px;max-width:calc(100% - 32px);text-align:center;animation:fade .15s}

/* формы */
label.f{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
.in,.sel,.ta{width:100%;min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);padding:0 14px;font-size:16px}
.ta{padding:12px 14px;min-height:80px;resize:vertical}
.in:focus,.sel:focus,.ta:focus{border-color:var(--accent);outline:0}
.in.err{border-color:var(--bad)}
.bigin{width:100%;border:0;background:transparent;text-align:center;font-family:var(--f-num);font-size:44px;font-weight:600;letter-spacing:-.03em;padding:6px 0;min-width:0;border-bottom:2px solid var(--line);border-radius:0}
.bigin:focus{outline:0;border-color:var(--accent)}
.errt{color:var(--bad);font-size:14px;margin-top:6px;min-height:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:99px;background:var(--surface2);font-size:15px;display:inline-flex;align-items:center;gap:6px;border:1.5px solid transparent}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-deep);font-weight:500}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:42px;border-radius:11px;font-weight:500;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two > *{min-width:0}
.empty{text-align:center;padding:34px 20px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:17px;margin-bottom:6px}
.empty .btn{margin-top:14px}
.check{display:flex;gap:12px;align-items:center;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 18px}
.dots i{width:28px;height:5px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--accent)}
.demo{background:var(--warn-soft);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:14.5px;display:flex;gap:10px;align-items:center;justify-content:space-between}
textarea.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;min-height:140px}
.hr{height:1px;background:var(--line);margin:14px 0}
.who{font-size:13.5px;color:var(--muted)}
.ar{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ar:first-child{border-top:0}
.ar .in{width:132px;min-height:44px;text-align:right;font-family:var(--f-num);font-weight:600;padding:0 12px}
.datew{position:relative}
.datew .in{padding-right:50px}
.calb{position:absolute;right:3px;top:3px;width:44px;height:44px;display:grid;place-items:center;color:var(--muted)}
.calb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.calp{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.nav button.mic{width:60px;height:60px;min-height:0;border-radius:50%;margin:-26px auto 0;padding:0;justify-content:center;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px rgba(30,40,20,.3)}
.nav button.mic svg{width:28px;height:28px;stroke-width:2}
.qwrap{position:relative;margin-top:12px}
.qwrap .in{padding-right:64px;min-height:58px;font-size:18px}
.micb{position:absolute;right:5px;top:5px;width:48px;height:48px;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);display:grid;place-items:center}
.micb svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.micb.on{background:var(--accent);color:var(--accent-ink);animation:pulse 1.3s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
@media (min-width:560px){body{padding-top:12px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.nav button{font-size:11.5px;padding:6px 0}
.ico{flex:none;position:relative;width:38px;height:38px;display:inline-grid;place-items:center;font-size:18px;line-height:1;margin-right:10px;vertical-align:middle;color:#262A21;--t:#B7CC9C}
.ico{isolation:isolate}
.ico::before{content:'';position:absolute;inset:0;border-radius:12px;background:var(--t);z-index:-1}
.ico svg{width:23px;height:23px;stroke:#262A21;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.ico svg [fill-opacity]{fill:none}
.ico.pic{width:38px;height:38px;border-radius:12px;overflow:hidden}
.ico.pic::before{display:none}
.ico img{width:100%;height:100%;object-fit:cover;display:block}
.ico.ltr,.ico.em{font-weight:700;font-size:16px}
.ico.big{width:48px;height:48px;font-size:25px}
.ico.big::before{border-radius:15px}
.ico.big svg{width:28px;height:28px}
.ico.pic.big{border-radius:14px}
.cat .row .ico{margin-right:0}
.li > .ico{margin-right:0}
.ipk{margin-top:4px}.ipk-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.ipk-top .in{width:92px;min-height:44px}
.ipk-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.ipk-i{min-height:46px;border-radius:14px;background:var(--surface2);display:grid;place-items:center;border:1.5px solid transparent}
.ipk-i.on{background:var(--t);border-color:#262A21}
.ipk-i svg{width:23px;height:23px;stroke:var(--ink);fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.ipk-i svg [fill-opacity]{fill:none}
.ipk-i.on svg{stroke:#262A21}

.gph{display:block;width:100%;height:150px;object-fit:cover;border-radius:14px;margin-bottom:10px}
.gph.none{height:auto;padding:18px 14px;background:var(--surface2);color:var(--muted);font-size:14px;text-align:center}
.goalc{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:12px;box-shadow:0 1px 2px rgba(30,40,20,.05)}
.goalc .gimg{height:150px;background-size:cover;background-position:center}
.goalc .gimg.none{height:84px;display:grid;place-items:center;background:var(--accent-soft)}
.goalc .gimg.none .ico{margin:0}
.goalc .gbody{padding:12px 16px 14px}
.goalc .gt{font-size:18px;font-weight:600}
.goalc .gsum{font-size:22px;font-weight:600;margin:4px 0 2px}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="page"></div>
<nav id="nav" class="nav" aria-label="Разделы"></nav>
<button id="fab" class="fab" data-a="expNew" aria-label="Добавить расход"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<script>
/* ===== ЛОГИКА: деньги хранятся в целых копейках, даты — строки YYYY-MM-DD ===== */
const L = {};
(function () {
  const pad = (n) => String(n).padStart(2, '0');
  let _today = null;
  L.setToday = (d) => { _today = d; };
  L.today = () => {
    if (_today) return _today;
    const d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  };
  L.uid = () => 'i' + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);

  /* ---------- даты ---------- */
  const daysIn = (m) => { const [y, mo] = m.split('-').map(Number); return new Date(Date.UTC(y, mo, 0)).getUTCDate(); };
  const monthOf = (d) => d.slice(0, 7);
  const monthStart = (m) => m + '-01';
  const monthEnd = (m) => m + '-' + pad(daysIn(m));
  const addMonths = (m, n) => { const [y, mo] = m.split('-').map(Number); const t = y * 12 + (mo - 1) + n; return Math.floor(t / 12) + '-' + pad((t % 12) + 1); };
  const dayOfMonth = (m, day) => m + '-' + pad(Math.min(Math.max(1, day | 0), daysIn(m)));
  const addDays = (d, n) => { const [y, m, dd] = d.split('-').map(Number); const t = new Date(Date.UTC(y, m - 1, dd + n)); return t.getUTCFullYear() + '-' + pad(t.getUTCMonth() + 1) + '-' + pad(t.getUTCDate()); };
  const addMonthsDate = (anchor, k) => { const nm = addMonths(monthOf(anchor), k); return nm + '-' + pad(Math.min(+anchor.slice(8), daysIn(nm))); };
  Object.assign(L, { daysIn, monthOf, monthStart, monthEnd, addMonths, dayOfMonth, addDays });
  L.daysBetween = (a, b) => Math.round((Date.UTC(+b.slice(0, 4), +b.slice(5, 7) - 1, +b.slice(8)) - Date.UTC(+a.slice(0, 4), +a.slice(5, 7) - 1, +a.slice(8))) / 86400000);
  L.validDate = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s || '') && L.daysIn(s.slice(0, 7)) >= +s.slice(8) && +s.slice(8) >= 1 && +s.slice(5, 7) >= 1 && +s.slice(5, 7) <= 12;

  /* ---------- деньги ---------- */
  L.parseMoney = (s, allowNeg) => {
    if (typeof s === 'number') return Number.isFinite(s) ? Math.round(s * 100) : null;
    let t = String(s == null ? '' : s).replace(/[\s ₽$€₸₴]/g, '').replace(',', '.');
    let neg = false;
    if (allowNeg && t[0] === '-') { neg = true; t = t.slice(1); }
    if (!/^(\d+(\.\d*)?|\.\d+)$/.test(t)) return null;
    const [a, b = ''] = t.split('.');
    const v = (parseInt(a || '0', 10)) * 100 + parseInt((b + '00').slice(0, 2), 10);
    return neg ? -v : v;
  };
  L.pctOf = (base, pct) => Math.floor((base * Math.round((pct || 0) * 100)) / 10000);
  const sum = (arr, f) => arr.reduce((s, x) => s + f(x), 0);

  /* ---------- стартовые данные ---------- */
  L.PRIO = { oblig: 1, daily: 2, goals: 3, personal: 4 };
  L.defaultGroups = () => [
    { id: 'g_oblig', name: 'Обязательства', kind: 'oblig' },
    { id: 'g_daily', name: 'Повседневная жизнь', kind: 'daily' },
    { id: 'g_personal', name: 'Личные расходы', kind: 'personal' },
    { id: 'g_goals', name: 'Накопления и цели', kind: 'goals' },
  ];
  L.STARTER = {
    oblig: ['Аренда и коммунальные услуги', 'Кредиты и рассрочки', 'Подписки', 'Телефон и интернет', 'Страховки и регулярные платежи'],
    daily: ['Продукты', 'Дом и быт', 'Транспорт', 'Здоровье и аптека', 'Кафе и доставка'],
    personal: ['Одежда и покупки', 'Красота и уход', 'Хобби', 'Развлечения и отдых', 'Подарки'],
    goals: ['Накопления', 'Финансовая подушка', 'Отпуск и крупные покупки'],
  };
  L.newRule = (kind) => ({ type: 'manual', amount: 0, pct: 0, priority: L.PRIO[kind] || 3, min: 0, max: 0 });
  L.newCat = (groupId, name, kind) => ({ id: L.uid(), groupId, name, rule: L.newRule(kind) });
  L.starterCats = () => {
    const out = [];
    L.defaultGroups().forEach((g) => L.STARTER[g.kind].forEach((n) => out.push(L.newCat(g.id, n, g.kind))));
    return out;
  };
  L.SCHEMA = 2; // 2: добавлены долги, курсы валют, значки, цели. Старые данные (v1) читаются без потерь.
  L.newState = () => ({
    v: 1, schema: L.SCHEMA,
    settings: { name: '', gender: '', currency: 'RUB', cents: 'auto', startBalance: 0, trackFrom: monthOf(L.today()), reservePct: 0, reserveFixed: 0, setupDone: false, demo: false },
    groups: L.defaultGroups(),
    cats: L.starterCats(),
    bills: [],
    plan: [
      { id: L.uid(), name: 'Поступление 1', day: 1, amount: 0 },
      { id: L.uid(), name: 'Поступление 2', day: 15, amount: 0 },
      { id: L.uid(), name: 'Поступление 3', day: 25, amount: 0 },
    ],
    txs: [],
    allocs: [],
    quick: { map: {} },
    debts: [],
    fx: { base: 'RUB', per: {}, at: '' },
  });

  L.normalize = (raw) => {
    if (!raw || typeof raw !== 'object' || !Array.isArray(raw.cats) || !Array.isArray(raw.txs) || !Array.isArray(raw.allocs) || !Array.isArray(raw.bills) || !Array.isArray(raw.plan) || !Array.isArray(raw.groups)) return null;
    const base = L.newState();
    const S = JSON.parse(JSON.stringify(raw));
    S.v = 1; S.schema = L.SCHEMA; // ключ хранения и поле v не меняем; всё новое только добавляется
    S.debts = Array.isArray(S.debts) ? S.debts : [];
    S.fx = S.fx && typeof S.fx === 'object' && S.fx.per && typeof S.fx.per === 'object' ? S.fx : { base: (raw.settings && raw.settings.currency) || 'RUB', per: {}, at: '' };
    S.quick = S.quick && typeof S.quick.map === 'object' && S.quick.map ? S.quick : { map: {} };
    S.settings = Object.assign({}, base.settings, S.settings || {});
    const int = (x) => (Number.isFinite(x) ? Math.round(x) : 0);
    S.settings.startBalance = int(S.settings.startBalance);
    S.cats.forEach((c) => { c.rule = Object.assign(L.newRule('personal'), c.rule || {}); c.name = String(c.name || 'Категория'); c.icon = typeof c.icon === 'string' ? c.icon : ''; if (c.goal && !(c.goal.target > 0 && L.validDate(c.goal.date))) c.goal = null; if (c.goal) { c.goal.target = int(c.goal.target); c.goal.name = typeof c.goal.name === 'string' ? c.goal.name : ''; c.goal.photo = typeof c.goal.photo === 'string' && c.goal.photo.indexOf('data:image/') === 0 ? c.goal.photo : ''; } });
    S.bills.forEach((b) => { b.span = b.span > 0 ? Math.min(366, b.span | 0) : 0; b.amount = int(b.amount); b.skipped = Array.isArray(b.skipped) ? b.skipped : []; b.period = b.period || 'month'; b.icon = typeof b.icon === 'string' ? b.icon : ''; });
    S.plan.forEach((p) => { p.amount = int(p.amount); p.dayTo = p.dayTo > p.day ? p.dayTo | 0 : 0; });
    S.txs.forEach((t) => { t.amount = int(t.amount); });
    S.allocs.forEach((a) => { a.amount = int(a.amount); });
    S.debts = S.debts.filter((d) => d && typeof d === 'object');
    S.debts.forEach((d) => { d.id = d.id || L.uid(); d.who = String(d.who || ''); d.dir = d.dir === 'owed' ? 'owed' : 'owe'; d.amount = int(d.amount); d.note = String(d.note || ''); d.date = d.date || ''; d.due = d.due || ''; d.paid = Array.isArray(d.paid) ? d.paid.filter((p) => p && p.amount > 0).map((p) => ({ date: p.date || '', amount: int(p.amount) })) : []; });
    return S;
  };

  /* ---------- базовые выборки ---------- */
  L.cat = (S, id) => S.cats.find((c) => c.id === id);
  L.group = (S, id) => S.groups.find((g) => g.id === id);
  L.catKind = (S, c) => { const g = c && L.group(S, c.groupId); return g ? g.kind : 'personal'; };

  L.cash = (S, m) => {
    const e = monthEnd(m);
    let c = S.settings.startBalance;
    for (const t of S.txs) if (t.date <= e) c += t.type === 'income' ? t.amount : -t.amount;
    return c;
  };

  L.env = (S, id, m) => {
    const s = monthStart(m), e = monthEnd(m);
    let carry = 0, alloc = 0, spent = 0;
    for (const a of S.allocs) if (a.catId === id) { if (a.month < m) carry += a.amount; else if (a.month === m) alloc += a.amount; }
    for (const t of S.txs) if (t.type === 'expense' && t.catId === id) { if (t.date < s) carry -= t.amount; else if (t.date <= e) spent += t.amount; }
    return { carry, alloc, spent, avail: carry + alloc, bal: carry + alloc - spent };
  };

  /* ---------- платежи ---------- */
  L.occ = (b, from, to) => {
    const out = [];
    if (!b.date) return out;
    const end = b.endDate && b.endDate < to ? b.endDate : to;
    for (let k = 0; k < 6000; k++) {
      const d = b.period === 'week' ? addDays(b.date, 7 * k)
        : b.period === 'year' ? addMonthsDate(b.date, 12 * k)
          : b.period === 'custom' ? addDays(b.date, Math.max(1, b.interval | 0) * k)
            : b.period === 'once' ? (k === 0 ? b.date : '9999-12-31')
              : addMonthsDate(b.date, k);
      if (d > end) break;
      if (d >= from) out.push(d);
    }
    return out;
  };

  // Платежи, относящиеся к месяцу m, и неоплаченные за прошлые месяцы (просрочка).
  L.billItems = (S, m) => {
    const e = monthEnd(m), s = monthStart(m), ts = monthStart(S.settings.trackFrom);
    const out = [];
    for (const b of S.bills) {
      for (const d of L.occ(b, ts, e)) {
        const tx = S.txs.find((t) => t.billId === b.id && t.dueDate === d) || null;
        const skipped = (b.skipped || []).includes(d);
        out.push({ bill: b, due: d, dueEnd: b.span > 0 ? addDays(d, b.span) : d, tx, skipped, paid: !!tx, paidAsOf: !!tx && tx.date <= e, amount: tx ? tx.amount : b.amount, inMonth: d >= s, overdue: d < s && !tx && !skipped });
      }
    }
    out.sort((a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : a.bill.name.localeCompare(b.bill.name)));
    return out;
  };

  // Какие неоплаченные платежи уже обеспечены деньгами в своём конверте.
  L.coverage = (S, m) => {
    const items = L.billItems(S, m).filter((i) => !i.paidAsOf && !i.skipped);
    const pool = {};
    let covered = 0, short = 0;
    for (const it of items) {
      const cid = it.bill.catId;
      if (!(cid in pool)) pool[cid] = L.cat(S, cid) ? Math.max(0, L.env(S, cid, m).bal) : 0;
      const cov = Math.min(pool[cid], it.amount);
      pool[cid] -= cov;
      it.covered = cov; it.short = it.amount - cov;
      covered += cov; short += it.short;
    }
    return { items, covered, short };
  };

  /* ---------- сводные показатели ---------- */
  L.totals = (S, m) => {
    const s = monthStart(m), e = monthEnd(m);
    const cash = L.cash(S, m);
    let pos = 0, over = 0;
    for (const c of S.cats) { const b = L.env(S, c.id, m).bal; if (b > 0) pos += b; else over -= b; }
    const cov = L.coverage(S, m);
    const unalloc = cash - pos;
    return {
      cash, pos, over, unalloc,
      reserved: cov.covered, unfunded: cov.short, pending: cov.items,
      safe: Math.max(0, unalloc - cov.short),
      incomeM: sum(S.txs.filter((t) => t.type === 'income' && t.date >= s && t.date <= e), (t) => t.amount),
      spentM: sum(S.txs.filter((t) => t.type === 'expense' && t.date >= s && t.date <= e), (t) => t.amount),
    };
  };

  L.slots = (S, m) =>
    S.plan.map((p) => {
      const tx = S.txs.find((t) => t.type === 'income' && t.slotId === p.id && t.slotMonth === m) || null;
      const date = dayOfMonth(m, p.day);
      return { slot: p, date, dateTo: p.dayTo > p.day ? dayOfMonth(m, p.dayTo) : date, planned: p.amount, tx, received: !!tx };
    }).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));

  // Плановая сумма категории на месяц (по её правилу и платежам).
  L.planned = (S, c, m) => {
    const slots = S.plan;
    const planInc = sum(slots, (p) => p.amount);
    const billsSum = sum(L.billItems(S, m).filter((i) => i.inMonth && i.bill.catId === c.id && !i.skipped), (i) => i.amount);
    return Math.max(billsSum, L.ruleAmount(S, c, planInc, m));
  };
  // Цель к дате: сколько откладывать в месяц (считается от остатка конверта на начало месяца).
  L.monthsLeft = (m, date) => { const [y1, a] = m.split('-').map(Number), [y2, b] = date.slice(0, 7).split('-').map(Number); return Math.max(1, (y2 - y1) * 12 + (b - a) + 1); };
  L.goalInfo = (S, c, m) => {
    const g = c && c.goal; if (!g || !(g.target > 0) || !L.validDate(g.date)) return null;
    const e = L.env(S, c.id, m), saved = Math.max(0, e.bal), carry = Math.max(0, e.carry);
    const months = L.monthsLeft(m, g.date), left = Math.max(0, g.target - saved);
    return { target: g.target, date: g.date, saved, left, months, overdue: g.date < monthStart(m), done: saved >= g.target, perMonth: Math.ceil(Math.max(0, g.target - carry) / months) };
  };
  L.ruleAmount = (S, c, planInc, m, depth) => {
    const r = c.rule;
    if (r.type === 'goal') { const gi = L.goalInfo(S, c, m); return gi ? gi.perMonth : 0; }
    if (r.type === 'fixedMonth') return r.amount;
    if (r.type === 'fixedEach') return r.amount * S.plan.length;
    if (r.type === 'pctIncome') return L.pctOf(planInc, r.pct);
    if (r.type === 'pctRemainder' && !depth) {
      const ob = sum(S.cats.filter((x) => L.catKind(S, x) === 'oblig'), (x) => Math.max(sum(L.billItems(S, m).filter((i) => i.inMonth && i.bill.catId === x.id && !i.skipped), (i) => i.amount), L.ruleAmount(S, x, planInc, m, 1)));
      return L.pctOf(Math.max(0, planInc - ob), r.pct);
    }
    return 0;
  };

  /* ---------- автораспределение ---------- */
  // Возвращает предложение: сколько добавить в каждую категорию. Состояние не меняет.
  L.planAllocation = (S, m, opts) => {
    opts = opts || {};
    const s = monthStart(m), e = monthEnd(m);
    const A = opts.fresh ? S.allocs.filter((a) => !(a.kind === 'income' && a.month === m)) : S.allocs;
    const S2 = Object.assign({}, S, { allocs: A });
    const T = L.totals(S2, m);
    const incTxs = S.txs.filter((t) => t.type === 'income' && t.date >= s && t.date <= e);
    const incomeTotal = sum(incTxs, (t) => t.amount);
    const nPlan = incTxs.filter((t) => t.kind === 'plan').length;
    const t0 = L.today();
    const ref = opts.refDate || (t0 >= s && t0 <= e ? t0 : t0 < s ? s : e);
    const future = L.slots(S, m).filter((x) => !x.received && x.dateTo > ref);
    const horizon = future.length ? future[0].dateTo : addDays(e, 1);

    const cats = S.cats, idx = {};
    cats.forEach((c, i) => { idx[c.id] = i; });
    const add = {}, bal = {}, mA = {};
    cats.forEach((c) => {
      add[c.id] = 0;
      bal[c.id] = L.env(S2, c.id, m).bal;
      mA[c.id] = sum(A.filter((a) => a.catId === c.id && a.month === m && a.kind !== 'move'), (a) => a.amount);
    });
    let pool = Math.max(0, T.unalloc);
    const pool0 = pool;
    const prio = (cid) => (L.cat(S, cid) ? L.cat(S, cid).rule.priority : 1);
    const cov = L.coverage(S2, m);
    const urgent = cov.items.filter((i) => i.short > 0 && i.due < horizon);
    const deferred = cov.items.filter((i) => i.short > 0 && i.due >= horizon);
    const billNeed = {};
    urgent.forEach((i) => { billNeed[i.bill.catId] = (billNeed[i.bill.catId] || 0) + i.short; });
    const events = [], shortfalls = [], conflicts = [];

    const give = (catId, x, ev) => {
      if (x <= 0 || !(catId in add)) return 0;
      add[catId] += x; pool -= x; events.push(Object.assign({ catId, amount: x }, ev));
      return x;
    };
    const list = [];
    urgent.forEach((i) => list.push({ kind: 'bill', it: i, catId: i.bill.catId, pr: prio(i.bill.catId), due: i.due, need: i.short, given: 0 }));
    cats.filter((c) => c.rule.min > 0).forEach((c) => list.push({ kind: 'min', catId: c.id, pr: c.rule.priority, due: '~', need: 0, given: 0 }));
    list.sort((a, b) => a.pr - b.pr || (a.kind === b.kind ? 0 : a.kind === 'bill' ? -1 : 1) || (a.due < b.due ? -1 : a.due > b.due ? 1 : 0) || (idx[a.catId] ?? 0) - (idx[b.catId] ?? 0));

    let locked = false;
    for (let i = 0; i < list.length && !locked;) {
      const it = list[i];
      if (it.kind === 'bill') {
        const grp = [];
        let j = i;
        while (j < list.length && list[j].kind === 'bill' && list[j].pr === it.pr && list[j].due === it.due) { grp.push(list[j]); j++; }
        const total = sum(grp, (g) => g.need);
        const ev = (g) => ({ kind: 'bill', label: g.it.bill.name, due: g.it.due });
        if (grp.length > 1 && total > pool) {
          if (opts.conflictMode === 'proportional') {
            const p0 = pool;
            grp.forEach((g) => { g.given = give(g.catId, Math.floor((p0 * g.need) / total), ev(g)); });
          } else if (opts.conflictMode === 'order') {
            grp.slice().sort((a, b) => (idx[a.catId] ?? 0) - (idx[b.catId] ?? 0)).forEach((g) => { g.given = give(g.catId, Math.min(g.need, pool), ev(g)); });
          } else {
            conflicts.push({ priority: it.pr, due: it.due, total, pool, items: grp.map((g) => ({ catId: g.catId, label: g.it.bill.name, need: g.need })) });
            locked = true;
          }
        } else grp.forEach((g) => { g.given = give(g.catId, Math.min(g.need, pool), ev(g)); });
        grp.forEach((g) => { if (!locked && g.need > g.given) shortfalls.push({ catId: g.catId, label: g.it.bill.name, short: g.need - g.given, kind: 'bill', due: g.due }); });
        i = j;
      } else {
        const c = L.cat(S, it.catId);
        let need = Math.max(0, c.rule.min - (bal[c.id] + add[c.id]));
        if (c.rule.max > 0) need = Math.min(need, Math.max(0, c.rule.max - (bal[c.id] + add[c.id])));
        const g = give(c.id, Math.min(need, pool), { kind: 'min', label: 'Минимум' });
        if (need > g) shortfalls.push({ catId: c.id, label: c.name, short: need - g, kind: 'min' });
        i++;
      }
    }

    // Свободный резерв (оставляем нераспределённым)
    const keep = L.pctOf(incomeTotal, S.settings.reservePct) + (incomeTotal > 0 ? S.settings.reserveFixed || 0 : 0);
    if (!locked) {
      const wants = cats.filter((c) => c.rule.type !== 'manual').sort((a, b) => a.rule.priority - b.rule.priority || idx[a.id] - idx[b.id]);
      for (const c of wants) {
        const r = c.rule, measured = mA[c.id] + add[c.id];
        let target = 0, label = '';
        if (r.type === 'fixedMonth') { target = r.amount; label = 'Фикс. в месяц'; }
        else if (r.type === 'fixedEach') { target = r.amount * nPlan; label = 'Фикс. с поступления'; }
        else if (r.type === 'pctIncome') { target = L.pctOf(incomeTotal, r.pct); label = r.pct + '% от поступлений'; }
        else if (r.type === 'goal') { const gi = L.goalInfo(S, c, m); target = gi ? gi.perMonth : 0; label = 'Цель к дате'; }
        else if (r.type === 'pctRemainder') {
          const ob = sum(cats.filter((x) => L.catKind(S, x) === 'oblig'), (x) => mA[x.id] + add[x.id]);
          target = L.pctOf(Math.max(0, incomeTotal - ob), r.pct); label = r.pct + '% от остатка';
        }
        let need = Math.max(0, target - measured);
        if (r.max > 0) need = Math.min(need, Math.max(0, r.max - (bal[c.id] + add[c.id])));
        const x = give(c.id, Math.min(need, Math.max(0, pool - keep)), { kind: 'want', label });
        if (need > x) shortfalls.push({ catId: c.id, label: c.name, short: need - x, kind: 'want' });
      }
    }
    const total = sum(Object.values(add), (v) => v);
    let surplus = 0;
    incTxs.forEach((t) => { if (t.kind === 'plan' && t.planned > 0 && t.amount > t.planned) surplus += t.amount - t.planned; });
    return { month: m, adds: add, total, pool0, left: T.unalloc - total, keep, events, shortfalls, deferred, conflicts, horizon, billNeed, incomeTotal, surplus, locked, unalloc: T.unalloc };
  };

  /* ---------- изменения состояния (мутируют S, возвращают {ok,error}) ---------- */
  L.applyAllocation = (S, m, adds, opts) => {
    opts = opts || {};
    const S2 = Object.assign({}, S, { allocs: opts.fresh ? S.allocs.filter((a) => !(a.kind === 'income' && a.month === m)) : S.allocs });
    const total = sum(Object.values(adds), (v) => Math.max(0, v));
    const free = L.totals(S2, m).unalloc;
    if (total > Math.max(0, free)) return { ok: false, error: 'Нельзя распределить больше свободных денег: доступно ' + Math.max(0, free) };
    if (opts.fresh) S.allocs = S2.allocs;
    const date = opts.date || L.today();
    for (const cid of Object.keys(adds)) if (adds[cid] > 0 && L.cat(S, cid)) S.allocs.push({ id: L.uid(), month: m, catId: cid, amount: adds[cid], date, kind: 'income', incomeId: opts.incomeId || null });
    return { ok: true, total };
  };
  L.topUp = (S, m, catId, amount, date) => {
    if (!(amount > 0)) return { ok: false, error: 'Введите сумму больше нуля' };
    const free = L.totals(S, m).unalloc;
    if (amount > free) return { ok: false, error: 'Свободных денег меньше: доступно ' + Math.max(0, free) };
    S.allocs.push({ id: L.uid(), month: m, catId, amount, date: date || L.today(), kind: 'manual' });

  L.addExpense = (S, o) => {

  /* ---------- быстрая запись: разбор фразы «вода 85» ---------- */
  const NW = { ноль: 0, один: 1, одна: 1, одну: 1, два: 2, две: 2, три: 3, четыре: 4, пять: 5, шесть: 6, семь: 7, восемь: 8, девять: 9, десять: 10, одиннадцать: 11, двенадцать: 12, тринадцать: 13, четырнадцать: 14, пятнадцать: 15, шестнадцать: 16, семнадцать: 17, восемнадцать: 18, девятнадцать: 19, двадцать: 20, тридцать: 30, сорок: 40, пятьдесят: 50, шестьдесят: 60, семьдесят: 70, восемьдесят: 80, девяносто: 90, сто: 100, двести: 200, триста: 300, четыреста: 400, пятьсот: 500, шестьсот: 600, семьсот: 700, восемьсот: 800, девятьсот: 900 };
  const THOU = /^тысяч/;

  // Приводим числа к «чистым цифрам»: «5 000», «5.000», «5 тысяч», «5к», «1,5 тыс», «2 тысячи 500», «5000₽».
  const THS = '(?:тысяч[а-я]*|тыс\\.?|т\\.?\\s?р\\.?|к|k)';

  L.parseQuick = (text) => {

    for (let i = 0; i < toks.length;) {

      while (j < toks.length && ((toks[j].w in NW) || THOU.test(toks[j].w))) {

  };
  L.QUICK_DICT = {

    'Кафе и доставка': ['кофе', 'капучин', 'латте', 'обед', 'ужин', 'завтрак', 'ресторан', 'кафе', 'пицц', 'бургер', 'суши', 'ролл', 'достав', 'макдон', 'столов', 'перекус', 'десерт'],

    'Одежда и покупки': ['футболк', 'куртк', 'обув', 'кроссовк', 'джинс', 'платье', 'одежд', 'сумк', 'носк', 'белье', 'свитер'],

  L.guessCat = (S, words) => {

/* ---------- хранение ---------- */
// Ключ хранения и прежние поля не меняются. Перед первым сохранением в новом формате прежние данные
// дополнительно копируются в отдельный ключ (он никогда не перезаписывается и не удаляется приложением).
function load() {
  let raw = null;
  try {
    raw = localStorage.getItem(KEY);
    if (raw) {
      const parsed = JSON.parse(raw), n = L.normalize(parsed);
      if (n) {
        const sv = parsed && parsed.schema ? parsed.schema : 1;
        if (sv < L.SCHEMA) { try { if (!localStorage.getItem(KEY + '.backup-v' + sv)) localStorage.setItem(KEY + '.backup-v' + sv, raw); } catch (e) { /* нет места — данные всё равно остаются в основном ключе */ } }
        return n;
      }
    }
  } catch (e) { persistOK = false; }
  // Данные есть, но не читаются: сохраняем исходный текст, чтобы новое сохранение его не затёрло.
  if (raw) { try { localStorage.setItem(KEY + '.corrupt-' + Date.now(), raw); } catch (e) { /* ничего не поделать */ } }
  return L.newState();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { persistOK = false; } }
function commit(keepScroll) { save(); render(keepScroll !== false); }

function fmt(k, o) {
  const frac = S.settings.cents === 'always' ? 2 : (k % 100 === 0 ? 0 : 2);
  let s;
  try { s = new Intl.NumberFormat('ru-RU', { style: 'currency', currency: S.settings.currency, minimumFractionDigits: frac, maximumFractionDigits: frac }).format(k / 100); }
  catch (e) { s = (k / 100).toFixed(frac) + ' ' + S.settings.currency; }
  if (o && o.sign && k > 0) s = '+' + s;
  return s;
}
const kopToInput = (k) => (k === 0 ? '' : k % 100 === 0 ? String(k / 100) : (k / 100).toFixed(2).replace('.', ','));

function saveIncome(id) {
  const err = (t) => { $('#f-err').textContent = t; };

  if (!L.validDate(date)) return err('Укажите дату');

    Object.assign(S.txs.find((t) => t.id === id), { amount, date, source: val('f-src').trim() });
    commit(); closeSheet(); toast('Доход сохранён');

/* ---------- История ---------- */
function viewHist() {
  const m = ui.month;
  let rows = [];
  S.txs.forEach((t) => { if (ui.fAll || L.monthOf(t.date) === m) rows.push({ k: 'tx', t, date: t.date }); });
  L.allocGroups(S).forEach((g) => { if (ui.fAll || L.monthOf(g.date) === m) rows.push({ k: 'ag', g, date: g.date }); });
  if (ui.fCat) rows = rows.filter((r) => (r.k === 'tx' ? r.t.type === 'expense' && r.t.catId === ui.fCat : r.g.items.some((a) => a.catId === ui.fCat)));
  if (ui.fType === 'expense') rows = rows.filter((r) => r.k === 'tx' && r.t.type === 'expense');
  if (ui.fType === 'income') rows = rows.filter((r) => r.k === 'tx' && r.t.type === 'income');
  if (ui.fType === 'alloc') rows = rows.filter((r) => r.k === 'ag');
  rows.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  const inc = rows.filter((r) => r.k === 'tx' && r.t.type === 'income').reduce((s, r) => s + r.t.amount, 0);
  const exp = rows.filter((r) => r.k === 'tx' && r.t.type === 'expense').reduce((s, r) => s + r.t.amount, 0);
  let h = ui.fAll ? '<div class="top"><div class="pagetitle" style="padding:0 6px">История</div></div>' : monthBar();
  h += '<div class="stack"><div class="chips"><button class="chip ' + (ui.fAll ? 'on' : '') + '" data-a="hAll">Все месяцы</button>' + [['all', 'Все'], ['expense', 'Расходы'], ['income', 'Доходы'], ['alloc', 'Распределение']].map((x) => '<button class="chip ' + (ui.fType === x[0] ? 'on' : '') + '" data-a="hType" data-t="' + x[0] + '">' + x[1] + '</button>').join('') + '</div>';
  h += '<select class="sel" id="h-cat" data-c="hCat" aria-label="Категория"><option value="">Все категории</option>' + S.groups.map((g) => '<optgroup label="' + esc(g.name) + '">' + S.cats.filter((c) => c.groupId === g.id).map((c) => '<option value="' + c.id + '"' + (ui.fCat === c.id ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('') + '</optgroup>').join('') + '</select></div>';
  if (!rows.length) {
    return h + '<div class="card empty" style="margin-top:16px"><h3>' + (S.txs.length || S.allocs.length ? 'Ничего не найдено' : 'Операций пока нет') + '</h3><p>' + (S.txs.length || S.allocs.length ? 'Измените фильтры или месяц.' : 'Добавьте первый доход или расход.') + '</p><button class="btn primary" data-a="expNew">Добавить расход</button> <button class="btn soft" data-a="incExtra">Добавить доход</button></div>';
  }
  h += '<div class="grid2" style="margin-top:14px"><div class="stat"><div class="l">Доходы</div><div class="v pos">' + fmt(inc) + '</div></div><div class="stat"><div class="l">Расходы</div><div class="v">' + fmt(exp) + '</div></div></div>';
  let last = '';
  rows.forEach((r) => {
    if (r.date !== last) { if (last) h += '</div>'; last = r.date; h += '<div class="gh"><h3>' + fmtDate(r.date) + '</h3></div><div class="list">'; }
    h += histRow(r);
  });
  return h + '</div>';
}
function histRow(r) {
  if (r.k === 'tx') {
    const t = r.t;
    if (t.type === 'income') return '<button class="li" data-a="txOpen" data-id="' + t.id + '"><div class="sp"><div class="t">' + esc(t.source || 'Доход') + '</div><div class="s">' + (t.kind === 'plan' ? 'Плановое поступление' : 'Дополнительный доход') + '</div></div><div class="amt pos">' + fmt(t.amount, { sign: true }) + '</div></button>';
    return '<button class="li" data-a="txOpen" data-id="' + t.id + '"><div class="sp"><div class="t">' + esc(t.title || catName(t.catId)) + '</div><div class="s">' + esc(catName(t.catId)) + (t.method ? ' · ' + esc(t.method) : '') + (t.billId ? ' · платёж' : '') + (t.cur ? ' · ' + esc(fmtForeign(t.orig, t.cur)) + ' × ' + rateText(t.rate) : '') + '</div></div><div class="amt">−' + fmt(t.amount) + '</div></button>';
  }
  const g = r.g, tot = g.items.reduce((s, a) => s + a.amount, 0);
  let title, sub, amt = fmt(Math.abs(tot));
  if (g.kind === 'move') { const a = g.items.find((x) => x.amount < 0), b = g.items.find((x) => x.amount > 0); title = 'Перенос'; sub = esc(catName(a && a.catId)) + ' → ' + esc(catName(b && b.catId)); amt = fmt(b ? b.amount : 0); }
  else if (g.kind === 'income') { title = 'Распределение поступления'; sub = g.items.length + ' ' + plural(g.items.length, ['категория', 'категории', 'категорий']); }
  else { title = tot >= 0 ? 'Пополнение конверта' : 'Возврат в свободные'; sub = esc(catName(g.items[0].catId)); }
  return '<button class="li" data-a="agOpen" data-id="' + esc(g.key) + '"><div class="sp"><div class="t">' + title + '</div><div class="s">' + sub + '</div></div><div class="amt muted">' + amt + '</div></button>';
}
function openAg(key) {

let qk = null, rec = null, listening = false, recErr = false;
function openQuick(auto) {
  qk = { catManual: false, amtManual: false, dateOff: 0, words: [], title: '' };
  openSheet('<h2>Быстрая запись</h2><p class="muted sm" style="margin-top:4px">Скажите или напишите: «вода 85» или «купила кофе за 250».</p>' +

    '<div class="sm muted" id="q-status" style="margin-top:8px;min-height:22px" role="status"></div>' +
    '<div class="two" style="margin-top:6px"><div><label class="f" for="q-amt">Сумма</label><input class="in" id="q-amt" inputmode="decimal" placeholder="0" data-i="qAmt"></div><div><label class="f">Когда</label><div class="in" id="q-when" style="display:flex;align-items:center">Сегодня</div></div></div>' +
    fxBlock('q', '', 0) +
    '<label class="f" for="q-cat">Категория</label><select class="sel" id="q-cat" data-c="qCat"><option value="">Выберите категорию</option>' + S.groups.map((g) => '<optgroup label="' + esc(g.name) + '">' + S.cats.filter((c) => c.groupId === g.id).map((c) => '<option value="' + c.id + '">' + esc(c.name) + '</option>').join('') + '</optgroup>').join('') + '</select>' +
    '<div class="errt" id="f-err"></div><div class="foot"><button class="btn primary block" id="q-save" data-a="qSave" disabled>Добавить расход</button><button class="btn ghost block" data-a="qMore">Подробнее</button><button class="btn block" data-a="close">Закрыть</button></div>');
  if (auto) startListen(); else focusQ();
}
const focusQ = () => { const e = document.getElementById('q-text'); if (e) setTimeout(() => e.focus(), 50); };
function qStatus(t, bad) { const e = document.getElementById('q-status'); if (e) { e.textContent = t; e.style.color = bad ? 'var(--warn)' : ''; } }
function qMicUi() { const b = document.getElementById('q-mic'); if (b) { b.classList.toggle('on', listening); b.setAttribute('aria-label', listening ? 'Остановить запись' : 'Говорить'); } }
function qUpdate() {
  const t = val('q-text'), r = L.parseQuick(t);
  qk.words = r.words; qk.title = r.title; qk.dateOff = r.dateOff;
  const amt = document.getElementById('q-amt');
  if (!qk.amtManual) amt.value = r.amount ? kopToInput(r.amount) : '';
  const cat = document.getElementById('q-cat');
  if (!qk.catManual) cat.value = L.guessCat(S, r.words) || '';
  document.getElementById('q-when').textContent = r.dateOff === -1 ? 'Вчера' : 'Сегодня';
  const cs = document.getElementById('q-cur');
  if (cs && !qk.curManual && (r.cur || '') !== cs.value && (!r.cur || fxList().indexOf(r.cur) >= 0)) { cs.value = r.cur || ''; fxChanged('q'); }
  fxInfoUpd('q'); qCheck();
}
function qCheck() {
  const a = L.parseMoney(val('q-amt')), c = val('q-cat'), b = document.getElementById('q-save'), fx = fxRead('q');
  if (b) b.disabled = !(a > 0 && c && (!fx.cur || fx.rate > 0));
  fxInfoUpd('q');
}
function startListen() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { qStatus('Голосовой ввод здесь недоступен. Наберите текст или нажмите значок микрофона на клавиатуре телефона.', true); focusQ(); return; }
  stopListen(); recErr = false;
  try {
    rec = new SR(); rec.lang = 'ru-RU'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
    rec.onstart = () => { listening = true; qMicUi(); qStatus('Слушаю. Скажите, например: «вода 85»'); };
    rec.onresult = (e) => { let t = ''; for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript + ' '; const el = document.getElementById('q-text'); if (el) { el.value = t.trim(); qUpdate(); } };
    rec.onerror = (e) => {
      recErr = true;
      const m = { 'not-allowed': 'Нет доступа к микрофону. Разрешите его в настройках браузера или наберите текст.', 'service-not-allowed': 'Нет доступа к микрофону. Разрешите его в настройках браузера или наберите текст.', network: 'Для распознавания голоса нужен интернет. Можно набрать текст.', 'no-speech': 'Речь не распознана. Нажмите микрофон и повторите.', 'audio-capture': 'Микрофон не найден.' };
      qStatus(m[e.error] || 'Голосовой ввод не сработал. Наберите текст.', true);
      if (e.error !== 'no-speech') focusQ();
    };
    rec.onend = () => { listening = false; qMicUi(); if (!recErr) { const el = document.getElementById('q-text'); qStatus(el && el.value.trim() ? 'Проверьте сумму и категорию, затем нажмите «Добавить расход».' : 'Ничего не услышала. Нажмите микрофон и повторите.'); } };
    rec.start();
  } catch (err) { qStatus('Голосовой ввод не запустился. Наберите текст.', true); focusQ(); }
}
function stopListen() { try { if (rec) { rec.onend = null; rec.onerror = null; rec.abort(); } } catch (e) { /* уже остановлено */ } rec = null; listening = false; qMicUi(); }
function saveQuick() {
  const fc = fxCollect('q', 'q-amt'), cid = val('q-cat');
  if (fc.error) return void (document.getElementById('f-err').textContent = fc.error);
  const amount = fc.amount;
  if (!cid) return void (document.getElementById('f-err').textContent = 'Выберите категорию');
  const date = L.addDays(L.today(), qk.dateOff);
  L.addExpense(S, { date, amount, catId: cid, title: qk.title, cur: fc.cur, orig: fc.orig, rate: fc.rate });
  if (fc.cur) { S.fx.last = S.fx.last || {}; S.fx.last[fc.cur] = fc.rate; }
  L.learnCat(S, qk.words, cid);
  commit(); closeSheet(); toast('Записано: ' + (qk.title ? qk.title + ' ' : '') + (fc.cur ? fmtForeign(fc.orig, fc.cur) + ' ≈ ' : '') + fmt(amount) + ' · ' + catName(cid));
}

const ruleText = (c) => {
  const r = c.rule; let t = '';
  if (r.type === 'manual') t = 'Вручную';
  else if (r.type === 'fixedMonth') t = fmt(r.amount) + ' в месяц';
  else if (r.type === 'fixedEach') t = fmt(r.amount) + ' с каждого поступления';
  else if (r.type === 'pctIncome') t = r.pct + '% от поступления';
  else if (r.type === 'goal') t = c.goal ? 'Цель к дате: ' + fmt(L.goalInfo(S, c, ui.month) ? L.goalInfo(S, c, ui.month).perMonth : 0) + ' в месяц' : 'Цель к дате (не задана)';
  else t = r.pct + '% от остатка после обязательств';

};

/* ---------- предпросмотр распределения ---------- */
function openAlloc(o) {
  o = o || {};
  ui.pv = { m: o.month || ui.month, income: o.income || null, refDate: o.refDate || null, fresh: !!o.fresh, mode: null, res: null, adds: {} };
  pvCompute();
}
function pvCompute() {
  const pv = ui.pv;
  pv.res = L.planAllocation(S, pv.m, { refDate: pv.refDate || undefined, fresh: pv.fresh, conflictMode: pv.mode });
  pv.adds = Object.assign({}, pv.res.adds);
  renderPv();
}
function pvReason(c) {
  const ev = ui.pv.res.events.filter((e) => e.catId === c.id).map((e) => (e.kind === 'bill' ? 'Платёж «' + e.label + '» до ' + fmtDate(e.due) : e.kind === 'min' ? 'Минимальная сумма' : e.label));

}
function renderPv() {

  const prim = S.cats.filter((c) => (pv.adds[c.id] || 0) > 0 || need(c) > 0 || short(c));

  setSheet(h);
  pvLive();
}
function pvLive() {
  const pv = ui.pv; if (!pv) return;
  let total = 0, bad = false;
  const g = { oblig: 0, daily: 0, personal: 0, goals: 0 };
  document.querySelectorAll('#ov [data-i="pv"]').forEach((el) => {
    const raw = el.value.trim(), v = raw === '' ? 0 : L.parseMoney(raw);
    el.classList.toggle('err', v === null);
    if (v === null) { bad = true; return; }
    pv.adds[el.dataset.id] = v; total += v;
    const c = L.cat(S, el.dataset.id); g[L.catKind(S, c)] = (g[L.catKind(S, c)] || 0) + v;
    const need = pv.res.billNeed[el.dataset.id] || 0, w = document.getElementById('pw-' + el.dataset.id);
    if (w) w.textContent = need > v ? 'Не хватит на платежи: ещё ' + fmt(need - v) : '';
  });
  Object.keys(g).forEach((k) => { const e = document.getElementById('pv-g-' + k); if (e) e.textContent = fmt(g[k]); });
  const free = pv.res.unalloc - total, fe = document.getElementById('pv-free');
  if (fe) { fe.textContent = fmt(free); fe.style.color = free < 0 ? 'var(--bad)' : ''; }
  const err = document.getElementById('pv-err'), btn = document.getElementById('pv-apply');
  const msg = bad ? 'Проверьте суммы: нужны числа.' : free < 0 ? 'Выделяется больше, чем есть свободных денег: на ' + fmt(-free) + '. Уменьшите суммы.' : '';
  if (err) err.textContent = msg;
  if (btn) btn.disabled = !!msg || total === 0;
}
function pvApply() {
  const pv = ui.pv; pvLive();
  const r = L.applyAllocation(S, pv.m, pv.adds, { incomeId: pv.income, fresh: pv.fresh, date: pv.refDate || L.today() });
  if (!r.ok) { $('#pv-err').textContent = r.error; return; }
  ui.pv = null; commit(); closeSheet(); toast('Деньги распределены');
}

function maskDate(raw, del) {
  let d = raw.replace(/\D/g, '').slice(0, 8);
  if (d.length >= 1 && d[0] > '3') d = '0' + d;
  if (d.length >= 2 && +d.slice(0, 2) > 31) d = '31' + d.slice(2);
  if (d.length >= 3 && d[2] > '1') d = d.slice(0, 2) + '0' + d.slice(2);
  if (d.length >= 4 && +d.slice(2, 4) > 12) d = d.slice(0, 2) + '12' + d.slice(4);
  d = d.slice(0, 8);
  let o = d.slice(0, 2);
  if (d.length > 2) o += '.' + d.slice(2, 4);
  if (d.length > 4) o += '.' + d.slice(4);
  if (!del && (d.length === 2 || d.length === 4)) o += '.';
  return o;
}

function swapCat(id, dir) {
  const c = L.cat(S, id), idxs = S.cats.map((x, i) => (x.groupId === c.groupId ? i : -1)).filter((i) => i >= 0);
  const p = idxs.indexOf(S.cats.indexOf(c)), q = p + dir;
  if (q < 0 || q >= idxs.length) return;
  const a = idxs[p], b = idxs[q]; [S.cats[a], S.cats[b]] = [S.cats[b], S.cats[a]];
  commit();
}
